<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="fragments/head :: header"></head>
<body>
<div class="dashboard-main-wrapper">
    <div th:replace="fragments/header :: header"></div>
    <div th:replace="fragments/left-sidebar :: left-sidebar"></div>
    <div class="dashboard-wrapper">
        <div class="dashboard-ecommerce">
            <div class="container-fluid dashboard-content">
                <header class="panel-heading text-center">
                    <h3 class="panel-title">Payment Cancelled</h3>
                </header>
                <div class="ecommerce-widget">
                    <div class="card">
                        <div class="card-body text-center">
                            <!-- Cancellation Message -->
                            <div class="alert alert-warning mb-4" role="alert">
                                <i class="fas fa-times-circle fa-3x mb-3"></i>
                                <h4 class="alert-heading">Payment Cancelled</h4>
                                <p th:text="${message ?: 'Your payment process was cancelled.'}"></p>
                                <hr>
                                <p class="mb-0">You can try again anytime from the payments list.</p>
                            </div>

                            <!-- Navigation buttons -->
                            <div class="mt-4">
                                <a th:href="@{/payments/list}" class="btn btn-primary">
                                    <i class="fas fa-list mr-2"></i>Return to Payments List
                                </a>
                                <a th:href="@{/dashboard}" class="btn btn-secondary ml-3">
                                    <i class="fas fa-home mr-2"></i>Go to Dashboard
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- Footer and JS fragments, inside main wrapper -->
    <div th:replace="fragments/footer :: footer"></div>
    <div th:replace="fragments/javascript :: js"></div>
</div>
</body>
</html>
