<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="fragments/head :: header"></head>
<body>
<div class="dashboard-main-wrapper">
    <div th:replace="fragments/header :: header"></div>
    <div th:replace="fragments/left-sidebar :: left-sidebar"></div>
    <div class="dashboard-wrapper">
        <div class="dashboard-ecommerce">
            <div class="container-fluid dashboard-content">
                <header class="panel-heading text-center">
                    <h3 class="panel-title">Payments Report List</h3>
                </header>
                <div class="ecommerce-widget">

                    <!-- Year Selector -->
                    <form class="form-inline mb-3" th:action="@{/payment/list}" method="get">
                        <label for="year" class="mr-2 font-weight-bold">Year:</label>
                        <select id="year" name="year" class="form-control mr-2">
                            <option th:each="year : ${years}" th:value="${year}" th:text="${year}"
                                    th:selected="${year == selectedYear}"></option>
                        </select>
                        <button type="submit" class="btn btn-primary">Submit</button>
                    </form>

                    <!-- Search (HTML-Only, for enhancement) -->
                    <div class="row mb-2">
                        <div class="col-sm-6">
                            <input type="search" class="form-control" placeholder="Search..." id="payment-search">
                        </div>
                    </div>

                    <!-- Payments Table -->
                    <div class="table-responsive">
                        <table class="table table-striped table-bordered" id="payments-table">
                            <thead>
                                <tr>
                                    <th>#</th>
                                    <th>Payment Month</th>
                                    <th>Amount</th>
                                    <th>Status</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="payment, iterStat : ${payments}">
                                    <td th:text="${iterStat.count}"></td>
                                    <td th:text="${payment.month.value}"></td>
                                    <td>$<span th:text="${payment.amount}"></span></td>
                                    <td>
                                        <a th:if="${payment.status == 'UNPAID'}"
                                           th:href="@{|/payment/pay/${payment.id}|}"
                                           class="btn btn-success btn-sm">Pay</a>
                                        <a th:if="${payment.status == 'PAID'}"
                                           th:href="@{|/payment/invoice/${payment.id}|}"
                                           class="btn btn-info btn-sm">Invoice</a>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                    <!-- Pagination Controls -->
                    <nav th:if="${totalPages > 0}">
                        <ul class="pagination justify-content-center" id="table-pagination">
                            <li class="page-item" th:classappend="${currentPage <= 1} ? 'disabled'">
                                <a class="page-link" th:href="@{/payment/list(year=${selectedYear},page=${currentPage > 1 ? currentPage - 1 : 1},size=${size})}">Prev</a>
                            </li>
                            <li class="page-item" 
                                th:each="pageNum : ${#numbers.sequence(1, totalPages)}"
                                th:classappend="${currentPage == pageNum} ? 'active'">
                                <a class="page-link" 
                                   th:href="@{/payment/list(year=${selectedYear},page=${pageNum},size=${size})}"
                                   th:text="${pageNum}"></a>
                            </li>
                            <li class="page-item" th:classappend="${currentPage >= totalPages} ? 'disabled'">
                                <a class="page-link" th:href="@{/payment/list(year=${selectedYear},page=${currentPage < totalPages ? currentPage + 1 : totalPages},size=${size})}">Next</a>
                            </li>
                        </ul>
                    </nav>

                </div>
            </div>
        </div>
    </div>
    <!-- Footer and JS fragments, inside main wrapper -->
    <div th:replace="fragments/footer :: footer"></div>
    <div th:replace="fragments/javascript :: js"></div>
</div>
</body>
</html>
