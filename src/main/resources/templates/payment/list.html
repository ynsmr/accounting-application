<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="fragments/head :: header"></head>
<body>
<div class="dashboard-main-wrapper">
    <div th:replace="fragments/header :: header"></div>
    <div th:replace="fragments/left-sidebar :: left-sidebar"></div>
    <div class="dashboard-wrapper">
        <div class="dashboard-ecommerce">
            <div class="container-fluid dashboard-content">
                <header class="panel-heading text-center">
                    <h3 class="panel-title">Payments Report List</h3>
                </header>
                <div class="ecommerce-widget">

                    <!-- Year Input Form -->
                    <form class="form-inline mb-3" th:action="@{/payments/list}" method="get">
                        <div class="form-group">
                            <label for="year" class="mr-2 font-weight-bold">Year:</label>
                            <input type="number" id="year" name="year" class="form-control mr-2"
                                   th:value="${selectedYear}"
                                   min="2000" max="2099" step="1" required>
                        </div>
                        <button type="submit" class="btn btn-primary">Search</button>
                    </form>

                    <!-- Error Message Display -->
                    <div th:if="${errorMessage}" class="alert alert-warning mt-2" role="alert">
                        <i class="fas fa-exclamation-triangle mr-2"></i>
                        <span th:text="${errorMessage}"></span>
                    </div>

                    <!-- Payment List Table -->
                    <div class="card">
                        <div class="card-header">
                            <h3 class="card-title">Payment List</h3>
                        </div>
                        <div class="card-body">
                            <table class="table table-striped table-bordered table-hover">
                                <thead class="thead-light">
                                <tr>
                                    <th>#</th>
                                    <th>Month</th>
                                    <th>Amount</th>
                                    <th>Payment Date</th>
                                    <th>Status</th>
                                    <th>Actions</th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr th:each="payment, iterStat : ${payments}">
                                    <td th:text="${iterStat.count}"></td>
                                    <td th:text="${payment.month.value}"></td>
                                    <td>$<span th:text="${payment.amount}"></span></td>
                                    <td th:text="${payment.paymentDate != null ? #temporals.format(payment.paymentDate, 'MM/dd/yyyy') : 'N/A'}"></td>
                                    <td>
                                        <span th:if="${payment.isPaid}" class="badge badge-success">Paid</span>
                                        <span th:unless="${payment.isPaid}" class="badge badge-warning">Unpaid</span>
                                    </td>
                                    <td>
                                        <a th:if="${!payment.isPaid}" th:href="@{|/payments/pay/${payment.id}|}"
                                           class="btn btn-success btn-sm">Pay</a>
                                        <a th:if="${payment.isPaid}" th:href="@{|/payments/invoice/${payment.id}|}"
                                           class="btn btn-info btn-sm">Invoice</a>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(payments)}">
                                    <td colspan="6" class="text-center">No payments found for selected year</td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>
    <!-- Footer and JS fragments, inside main wrapper -->
    <div th:replace="fragments/footer :: footer"></div>
    <div th:replace="fragments/javascript :: js"></div>
</div>
</body>
</html>
